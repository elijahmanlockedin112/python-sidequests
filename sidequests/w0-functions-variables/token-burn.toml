title = "Token Burn"
order = 3
exact_case = true
powers = ["several functions that return values", "int() / float()", "arithmetic and percentages", "f-strings:  :.4f  :,.2f  :.1f  :,"]

story = '''
Clarion is about to ship an AI feature, and your co-founder wants a full cost
report before launch: prompt caching included, a monthly budget, and the most
traffic you can afford. A surprise bill is not an option. Every number has to
be exact.
'''

task = '''
Prices (store them in variables in your code):
  input tokens:          $3.00 per million
  cached input tokens:   $0.30 per million
  output tokens:         $15.00 per million

Ask for, in this order:
  1. the model name
  2. requests per day
  3. average input tokens per request
  4. what percent of those input tokens are cached (0 to 100)
  5. average output tokens per request
  6. your monthly budget, in dollars

Cached tokens are billed at the cached price INSTEAD of the normal input price.

Print exactly these six lines:
  COST REPORT: <MODEL NAME IN CAPS, no spaces around it>
  Per request: $<cost of one request, 4 decimals>
  Per day: $<2 decimals, commas for thousands>
  Per month: $<30 days of that, 2 decimals, commas for thousands>
  Budget used: <the month's cost as a percent of the budget, 1 decimal>%
  Max requests per day: <most requests a day the budget covers for 30 days,
                         rounded DOWN to a whole number, commas for thousands>

Write at least two functions that return values, and use them:
  cost(tokens, price_per_million)   dollars for that many tokens
  per_request(...)                  dollars for ONE request (it calls cost)
'''

example = '''
$ python token_burn.py
Model:   claude opus
Requests per day: 1000
Average input tokens: 1200
Percent cached: 50
Average output tokens: 300
Monthly budget: 300
COST REPORT: CLAUDE OPUS
Per request: $0.0065
Per day: $6.48
Per month: $194.40
Budget used: 64.8%
Max requests per day: 1,543
'''

hint = "Build it in layers. Get cost() right on its own, then per_request() for ONE request, then scale up to a day, a month, and the budget. Print after every layer while you test."

syntax = '''
def area(width, height):
    return width * height

40 / 100 * 80        ->  32.0      (40 percent of 80)
int(7.9)             ->  7         (int() drops the decimals: rounds DOWN)
round(7.9)           ->  8         (round() goes to the NEAREST whole number)
f"{0.00648:.4f}"     ->  "0.0065"
f"{64.83:.1f}"       ->  "64.8"
f"{1543:,}"          ->  "1,543"
'''

pseudocode = '''
cost(tokens, price): the tokens in millions, times the price

per_request(input tokens, cached percent, output tokens):
    cached <- input tokens * cached percent / 100
    fresh  <- input tokens - cached
    return cost(fresh, input price) + cost(cached, cached price) + cost(output, output price)

main:
    ask the six questions (strip the model; turn the numbers into int / float)
    one   <- per_request(...)
    day   <- one * requests;   month <- day * 30
    used  <- month / budget * 100
    most  <- budget / (one * 30), rounded DOWN
    print the six lines
'''

extend = [
  "After Week 1: print OVER BUDGET when the month costs more than the budget.",
  "Compare two models side by side: ask for a second set of three prices.",
]

[[checks]]
name = "The example (half the input is cached)"
stdin = "  claude opus \n1000\n1200\n50\n300\n300\n"
expect = ["re:COST REPORT: CLAUDE OPUS$", 're:Per request:\s*\$0\.0065\b', 're:Per day:\s*\$6\.48\b',
          're:Per month:\s*\$194\.40\b', 're:Budget used:\s*64\.8%', 're:Max requests per day:\s*1,543\b']
show = '''
COST REPORT: CLAUDE OPUS
Per request: $0.0065
Per day: $6.48
Per month: $194.40
Budget used: 64.8%
Max requests per day: 1,543
'''

[[checks]]
name = "No caching, and over budget"
stdin = "SONNET\n1000\n1200\n0\n300\n200\n"
expect = ["re:COST REPORT: SONNET$", 're:Per request:\s*\$0\.0081\b', 're:Per day:\s*\$8\.10\b',
          're:Per month:\s*\$243\.00\b', 're:Budget used:\s*121\.5%', 're:Max requests per day:\s*823\b']
show = '''
COST REPORT: SONNET
Per request: $0.0081
Per day: $8.10
Per month: $243.00
Budget used: 121.5%
Max requests per day: 823
'''

[[checks]]
name = "A busy app (commas for thousands)"
stdin = "haiku\n5000\n2000\n80\n500\n1000\n"
expect = ["re:COST REPORT: HAIKU$", 're:Per request:\s*\$0\.0092\b', 're:Per day:\s*\$45\.90\b',
          're:Per month:\s*\$1,377\.00\b', 're:Budget used:\s*137\.7%', 're:Max requests per day:\s*3,631\b']
show = '''
COST REPORT: HAIKU
Per request: $0.0092
Per day: $45.90
Per month: $1,377.00
Budget used: 137.7%
Max requests per day: 3,631
'''

[[checks]]
name = "A tiny bot (rounding DOWN, not to the nearest)"
stdin = "  tiny bot  \n10\n100\n10\n50\n5\n"
expect = ["re:COST REPORT: TINY BOT$", 're:Per request:\s*\$0\.0010\b', 're:Per day:\s*\$0\.01\b',
          're:Per month:\s*\$0\.31\b', 're:Budget used:\s*6\.1%', 're:Max requests per day:\s*162\b']
show = '''
COST REPORT: TINY BOT
Per request: $0.0010
Per day: $0.01
Per month: $0.31
Budget used: 6.1%
Max requests per day: 162
'''
