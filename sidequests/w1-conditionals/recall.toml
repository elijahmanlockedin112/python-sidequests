[[prompt]]
id = "hot-cold"
q = "Write if / elif / else that prints hot when temp is above 30, cold below 10, and fine otherwise."
a = '''
if temp > 30:
    print("hot")
elif temp < 10:
    print("cold")
else:
    print("fine")
'''

[[prompt]]
id = "equals"
q = "What is the difference between = and == ?"
a = "= assigns a value to a variable. == compares two values and gives back True or False."

[[prompt]]
id = "is-even"
q = "Write is_even(n) that returns True or False, without using the word if."
a = '''
def is_even(n):
    return n % 2 == 0
'''

